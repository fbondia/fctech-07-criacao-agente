[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora com Google ADK e garantias transacionais"
requires-python = ">=3.12,<3.15"
dependencies = [
    "google-adk==2.9.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "aiosqlite>=0.21,<1",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
aurora-api = "aurora.cli:serve"
aurora-reset = "aurora.cli:reset"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
